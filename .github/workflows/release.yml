name: Build and Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and Package
    runs-on: windows-latest
    outputs:
      new_tag: ${{ steps.version.outputs.new_tag }}
      app_version: ${{ steps.version.outputs.app_version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            nuget-

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Resolve Release Version
        id: version
        shell: pwsh
        run: |
          git fetch --tags --force
          $assemblyInfoPath = "src/Properties/AssemblyInfo.cs"
          $content = Get-Content $assemblyInfoPath -Raw
          $regex = [regex]'AssemblyVersion\("([0-9\.]+)"\)'
          $match = $regex.Match($content)
          $rawVer = if ($match.Success) { $match.Groups[1].Value } else { "3.0.8.0" }
          $parts = $rawVer.Split('.')
          $major = $parts[0]
          $minor = if ($parts.Length -gt 1) { $parts[1] } else { "0" }
          $patch = if ($parts.Length -gt 2) { $parts[2] } else { "0" }
          $baseVer = "$major.$minor.$patch"
          
          $allTags = git tag -l
          $tagCandidate = "v$baseVer"
          if ($allTags -contains $tagCandidate -or $allTags -contains $baseVer) {
              $newTag = "v$baseVer.${{ github.run_number }}"
              $targetVer = "$baseVer.${{ github.run_number }}"
          } else {
              $newTag = "v$baseVer"
              $targetVer = "$baseVer.0"
          }
          
          Write-Host "Resolved release tag: $newTag"
          Write-Host "Updating AssemblyInfo.cs to: $targetVer"
          
          $newContent = $regex.Replace($content, "AssemblyVersion(`"$targetVer`")")
          $newContent | Set-Content $assemblyInfoPath -Encoding utf8
          
          "new_tag=$newTag" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "app_version=$targetVer" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Restore NuGet packages
        shell: pwsh
        run: dotnet restore src/WinMemoryCleaner.sln

      - name: Build solution
        shell: pwsh
        run: dotnet build src/WinMemoryCleaner.sln -c Release --no-restore

      - name: Run Unit Tests
        shell: pwsh
        run: |
          Write-Host "Running release gate tests..."
          dotnet test src/WinMemoryCleaner.Tests.csproj -c Release
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::Release aborted: Tests failed."
            exit $LASTEXITCODE
          }

      - name: Check SignPath Availability
        id: check_signpath
        shell: pwsh
        env:
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
        run: |
          if (-not [string]::IsNullOrWhiteSpace($env:SIGNPATH_API_TOKEN)) {
            "can_sign=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          } else {
            "can_sign=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          }

      - name: Upload EXE for signing
        if: steps.check_signpath.outputs.can_sign == 'true'
        id: upload-for-signing
        uses: actions/upload-artifact@v4
        with:
          name: winmemorycleaner-unsigned
          path: src\bin\Release\WinMemoryCleaner.exe
          if-no-files-found: error

      - name: Submit to SignPath (if configured)
        if: steps.check_signpath.outputs.can_sign == 'true'
        id: signpath
        uses: signpath/github-action-submit-signing-request@v1.1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
          project-slug: WinMemoryCleaner
          signing-policy-slug: release-signing
          github-artifact-id: ${{ steps.upload-for-signing.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: ./

      - name: Package Release Artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "release_package"
          
          # Use signed binary if available, otherwise release built binary
          if (Test-Path "WinMemoryCleaner.exe") {
              $exePath = "WinMemoryCleaner.exe"
          } else {
              $exePath = "src/bin/Release/WinMemoryCleaner.exe"
          }
          
          Copy-Item $exePath -Destination "release_package/WinMemoryCleaner.exe"
          Copy-Item "README.md" -Destination "release_package/README.md"
          Copy-Item "CHANGELOG.md" -Destination "release_package/CHANGELOG.md"
          
          # Create ZIP archive
          Compress-Archive -Path "release_package/WinMemoryCleaner.exe", "release_package/README.md", "release_package/CHANGELOG.md" -DestinationPath "release_package/WinMemoryCleaner.zip"
          
          # Create SHA256 Checksums
          Get-FileHash -Algorithm SHA256 -Path "release_package/WinMemoryCleaner.exe", "release_package/WinMemoryCleaner.zip" | ForEach-Object {
              $_.Hash.ToLower() + "  " + (Split-Path -Leaf $_.Path)
          } | Out-File -FilePath "release_package/checksums.txt" -Encoding utf8
          
          Write-Host "Generated release artifacts:"
          Get-ChildItem -Path "release_package" | Select-Object Name, Length

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: winmemorycleaner-release-${{ steps.version.outputs.new_tag }}
          path: release_package/*
          retention-days: 7

  release:
    name: Publish Release to GitHub
    needs: build
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          name: winmemorycleaner-release-${{ needs.build.outputs.new_tag }}
          path: release_artifacts

      - name: Format Release Notes
        id: release_notes
        shell: pwsh
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          $tag = "${{ needs.build.outputs.new_tag }}"
          
          $msg = if ($env:COMMIT_MSG) { $env:COMMIT_MSG.Trim() } else { (git log -1 --pretty=%B).Trim() }
          $date = (git log -1 --date=short --pretty=%cd).Trim()
          $sha = (git rev-parse --short HEAD).Trim()
          $author = (git log -1 --pretty=%an).Trim()
          
          $recentLogs = (git log -5 --pretty=format:"- %h %s (%an)") -join "`n"
          
          $body = @"
          ## 🚀 WinMemoryCleaner $tag
          
          ### 📝 更新内容 / What's Changed
          $msg
          
          ### 🔍 最近提交记录 / Recent Commits
          $recentLogs
          
          ---
          - **Commit**: $sha
          - **Date**: $date
          - **Author**: $author
          - **Repository**: ${{ github.repository }}
          
          ### 📦 产物列表 / Release Assets
          - ``WinMemoryCleaner.exe``: Windows 原生单文件可执行程序（绿色即点即用）
          - ``WinMemoryCleaner.zip``: 便携绿色版压缩包（包含说明与变更文档）
          - ``checksums.txt``: SHA-256 完整性哈希校验清单
          "@
          
          "body<<EOF" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "$body" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "EOF" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build.outputs.new_tag }}
          name: WinMemoryCleaner ${{ needs.build.outputs.new_tag }}
          body: ${{ steps.release_notes.outputs.body }}
          files: |
            release_artifacts/WinMemoryCleaner.exe
            release_artifacts/WinMemoryCleaner.zip
            release_artifacts/checksums.txt
          draft: false
          prerelease: false
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
